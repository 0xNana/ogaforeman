prompts:
  - name: site_report
    purpose: "Extract structured progress, blockers, and material observations from authorized site evidence."
    prompt_file: "site_report.txt"
    prompt_version: "v2"
  - name: intent_router
    purpose: "Classify conversational messages into typed, non-mutating destinations."
    prompt_file: "intent_router.txt"
    prompt_version: "v1"
  - name: action_interpreter
    purpose: "Interpret one authorized conversational mutation into typed semantic actions."
    prompt_file: "action_interpreter.txt"
    prompt_version: "v1"
  - name: agentic_conversation
    purpose: "Generate grounded project-specific answers from authorized live context."
    prompt_file: "agentic_conversation.txt"
    prompt_version: "v1"
