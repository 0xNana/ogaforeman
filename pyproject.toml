[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[project]
name = "ogaforeman"
version = "0.1.0"
description = "Autonomous Construction Site Coordinator built on Google ADK 2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk[db,gcp]==2.6.2",
    "google-genai>=2.17.0",
    "google-cloud-firestore==2.28.1",
    "google-cloud-storage==3.13.1",
    "google-cloud-trace==1.20.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.12.20241230",
]

[dependency-groups]
dev = [
    "xlwt>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "backing_services: requires Firestore or Storage emulators and proves durable persistence",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
