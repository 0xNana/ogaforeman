  <text x="1226" y="1066" class="small" text-anchor="middle">25</text>

  <rect x="1394" y="995" width="332" height="88" class="golden"/>
  <text x="1560" y="1024" class="box-title" text-anchor="middle">Approved typed action exactly once</text>
  <text x="1560" y="1047" class="box-copy" text-anchor="middle">Rejection completes without commitment</text>
  <text x="1560" y="1066" class="small" text-anchor="middle">26</text>

