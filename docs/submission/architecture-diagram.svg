  <text x="1439" y="571" class="box-copy" text-anchor="middle">Typed evidence interpretation</text>
  <text x="1439" y="589" class="small" text-anchor="middle">11 - no write authority</text>

  <rect x="1581" y="520" width="146" height="82" class="golden"/>
  <text x="1654" y="548" class="box-title" text-anchor="middle">Canonical IDs</text>
  <text x="1654" y="571" class="box-copy" text-anchor="middle">Aliases + ambiguity</text>
  <text x="1654" y="589" class="small" text-anchor="middle">12</text>

