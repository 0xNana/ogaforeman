  <text x="690" y="1047" class="box-copy" text-anchor="middle">Approve or reject version</text>
  <text x="690" y="1066" class="small" text-anchor="middle">23</text>

  <rect x="830" y="995" width="228" height="88" class="golden"/>
  <text x="944" y="1024" class="box-title" text-anchor="middle">Decision intake</text>
