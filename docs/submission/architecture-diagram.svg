  <text x="673" y="409" class="box-title" text-anchor="middle">Pub/Sub</text>
  <text x="673" y="432" class="box-copy" text-anchor="middle">Claims, retry, dead letter</text>
  <text x="673" y="451" class="small" text-anchor="middle">8 - at-least-once delivery</text>

  <rect x="817" y="380" width="198" height="90" class="golden"/>
  <text x="916" y="409" class="box-title" text-anchor="middle">Private Cloud Run worker</text>
  <text x="916" y="432" class="box-copy" text-anchor="middle">Authenticated push</text>
  <text x="916" y="451" class="small" text-anchor="middle">9 - claimed execution</text>

  <rect x="1061" y="380" width="222" height="90" class="golden"/>
  <text x="1172" y="409" class="box-title" text-anchor="middle">Google ADK Runner</text>
  <text x="1172" y="432" class="box-copy" text-anchor="middle">Registered workflow root</text>
  <text x="1172" y="451" class="small" text-anchor="middle">Durable session service</text>

  <rect x="1329" y="380" width="398" height="90" class="golden"/>
  <text x="1528" y="408" class="box-title" text-anchor="middle">daily_site_update_workflow</text>
  <text x="1528" y="431" class="box-copy" text-anchor="middle">ADK owns sequence, branching, merge, policy, interruption</text>
  <text x="1528" y="451" class="small" text-anchor="middle">10 - Golden operational workflow</text>

