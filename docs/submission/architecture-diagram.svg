  <text x="172" y="1024" class="box-title" text-anchor="middle">ADK approval boundary</text>
  <text x="172" y="1047" class="box-copy" text-anchor="middle">Purchase / commitment / safety</text>
  <text x="172" y="1066" class="small" text-anchor="middle">21</text>

