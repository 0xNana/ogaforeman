  <rect x="315" y="380" width="214" height="90" class="golden"/>
  <text x="422" y="409" class="box-title" text-anchor="middle">FastAPI event intake</text>
  <text x="422" y="432" class="box-copy" text-anchor="middle">Auth + validation + stable ID</text>
  <text x="422" y="451" class="small" text-anchor="middle">7 - normalized ProjectEvent</text>

