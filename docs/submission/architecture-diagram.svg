<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1450" viewBox="0 0 1800 1450" role="img" aria-labelledby="title desc">
  <title id="title">OG Foreman truthful production architecture and Golden Scenario</title>
  <desc id="desc">Project initialization uses direct Gemini structured extraction followed by deterministic validation, human review, typed commit, and Firestore. Agentic voice, photo, text, and delivery-delay events use FastAPI intake, Pub/Sub, a private Cloud Run worker, Google ADK Runner workflows, Gemini reasoning where needed, canonical entity resolution, typed tools, deterministic services, approval pause and native continuation, Firestore, Google Chat, Cloud Logging, Cloud Trace, ActivityEvent, and AgentRun.</desc>
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#047857"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6b7280"/>
    </marker>
    <style>
      .title { font: 700 31px Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; letter-spacing: 0; }
      .band-title { font: 700 14px Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .box-title { font: 700 15px Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .box-copy { font: 400 12px Arial, sans-serif; fill: #374151; letter-spacing: 0; }
      .small { font: 600 11px Arial, sans-serif; fill: #4b5563; letter-spacing: 0; }
      .badge { font: 700 11px Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .step { font: 700 11px Arial, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .band { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 5; }
      .init { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 4; }
      .golden { fill: #fff7ed; stroke: #dc2626; stroke-width: 3; rx: 4; }
      .runtime { fill: #ecfeff; stroke: #0f766e; stroke-width: 1.5; rx: 4; }
      .truth { fill: #ecfdf5; stroke: #047857; stroke-width: 2.5; rx: 4; }
      .observe { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.5; rx: 4; }
      .flow-red { fill: none; stroke: #dc2626; stroke-width: 4; marker-end: url(#arrow-red); }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .flow-green { fill: none; stroke: #047857; stroke-width: 2.5; marker-end: url(#arrow-green); }
      .flow-gray { fill: none; stroke: #6b7280; stroke-width: 1.8; marker-end: url(#arrow-gray); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1800" height="1450" fill="#f8fafc"/>
  <rect x="0" y="0" width="1800" height="86" fill="#ffffff"/>
  <line x1="0" y1="85" x2="1800" y2="85" stroke="#e5e7eb"/>
  <text id="title-text" x="40" y="40" class="title">OG Foreman submission architecture</text>
  <text x="40" y="66" class="subtitle">Gemini reasons, ADK coordinates operations, typed tools mutate, Firestore is truth</text>
  <rect x="1432" y="22" width="328" height="40" class="golden"/>
  <line x1="1452" y1="42" x2="1510" y2="42" class="flow-red"/>
  <text x="1530" y="47" class="box-title">Golden Scenario path</text>

  <!-- Project initialization -->
  <rect x="40" y="105" width="1720" height="190" class="band"/>
  <rect x="40" y="105" width="1720" height="34" fill="#dbeafe" rx="5"/>
  <text x="58" y="128" class="band-title">PROJECT INITIALIZATION - DIRECT GEMINI EXTRACTION, NO ADK</text>

  <rect x="65" y="162" width="188" height="82" class="init"/>
  <text x="159" y="188" class="box-title" text-anchor="middle">Project source</text>
  <text x="159" y="211" class="box-copy" text-anchor="middle">Schedule, scope, materials</text>
  <text x="159" y="229" class="small" text-anchor="middle">1</text>

  <rect x="288" y="162" width="210" height="82" class="init"/>
  <text x="393" y="188" class="box-title" text-anchor="middle">Direct Gemini extraction</text>
  <text x="393" y="211" class="box-copy" text-anchor="middle">Schema-constrained output</text>
  <text x="393" y="229" class="small" text-anchor="middle">2</text>

  <rect x="533" y="162" width="164" height="82" class="init"/>
  <text x="615" y="188" class="box-title" text-anchor="middle">Import draft</text>
  <text x="615" y="211" class="box-copy" text-anchor="middle">No domain writes</text>
  <text x="615" y="229" class="small" text-anchor="middle">3</text>

  <rect x="732" y="162" width="226" height="82" class="init"/>
  <text x="845" y="188" class="box-title" text-anchor="middle">Deterministic validation</text>
  <text x="845" y="211" class="box-copy" text-anchor="middle">Identity, conflicts, quantities</text>
  <text x="845" y="229" class="small" text-anchor="middle">4</text>

  <rect x="993" y="162" width="182" height="82" class="init"/>
  <text x="1084" y="188" class="box-title" text-anchor="middle">Human review</text>
  <text x="1084" y="211" class="box-copy" text-anchor="middle">Confirm or correct</text>
  <text x="1084" y="229" class="small" text-anchor="middle">5</text>

  <rect x="1210" y="162" width="216" height="82" class="init"/>
  <text x="1318" y="188" class="box-title" text-anchor="middle">Deterministic commit</text>
  <text x="1318" y="211" class="box-copy" text-anchor="middle">Typed services + transaction</text>
  <text x="1318" y="229" class="small" text-anchor="middle">5a</text>

  <rect x="1490" y="152" width="238" height="102" class="truth"/>
  <text x="1609" y="181" class="box-title" text-anchor="middle">Cloud Firestore</text>
  <text x="1609" y="204" class="box-copy" text-anchor="middle">Committed project truth</text>
  <text x="1609" y="223" class="small" text-anchor="middle">Tasks, dependencies, materials</text>
  <text x="1609" y="240" class="small" text-anchor="middle">same domain truth shown below</text>

