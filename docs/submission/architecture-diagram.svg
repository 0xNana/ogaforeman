  <text x="117" y="382" class="badge" text-anchor="middle">6 GOLDEN</text>
  <text x="166" y="412" class="box-title" text-anchor="middle">Voice + photo + text</text>
  <text x="166" y="435" class="box-copy" text-anchor="middle">Authenticated site team</text>
