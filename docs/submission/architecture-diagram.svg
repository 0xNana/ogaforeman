  <text x="1407" y="701" class="box-copy" text-anchor="middle">Progress | blockers | materials</text>
  <text x="1407" y="719" class="small" text-anchor="middle">13</text>

  <rect x="1010" y="650" width="225" height="82" class="golden"/>
  <text x="1122" y="678" class="box-title" text-anchor="middle">Merge + policy</text>
  <text x="1122" y="701" class="box-copy" text-anchor="middle">Safe vs approval-required</text>
  <text x="1122" y="719" class="small" text-anchor="middle">14</text>

  <rect x="751" y="650" width="214" height="82" class="golden"/>
  <text x="858" y="678" class="box-title" text-anchor="middle">Typed tools</text>
  <text x="858" y="701" class="box-copy" text-anchor="middle">Auth + policy + idempotency</text>
  <text x="858" y="719" class="small" text-anchor="middle">15 / 19 / 20</text>

  <rect x="480" y="650" width="226" height="82" class="golden"/>
  <text x="593" y="678" class="box-title" text-anchor="middle">Domain services</text>
  <text x="593" y="701" class="box-copy" text-anchor="middle">Tasks, risks, requests, Daily Log</text>
  <text x="593" y="719" class="small" text-anchor="middle">ActivityEvent emitted</text>

  <rect x="64" y="650" width="370" height="82" class="truth"/>
  <text x="249" y="677" class="box-title" text-anchor="middle">Cloud Firestore - domain source of truth</text>
  <text x="249" y="700" class="box-copy" text-anchor="middle">Tasks, dependencies, inventory, requirements</text>
  <text x="249" y="718" class="small" text-anchor="middle">Approvals, reports, claims, outbox | never direct from Gemini</text>

