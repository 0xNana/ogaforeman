  <rect x="40" y="315" width="1720" height="34" fill="#ccfbf1" rx="5"/>
  <text x="58" y="338" class="band-title">AGENTIC OPERATIONS - AUTHENTICATED EVENTS TO GOOGLE ADK RUNNER</text>

